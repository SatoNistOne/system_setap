# /boot/limine.conf — header written once by install.sh; entries below are
# managed by limine-update / limine-snapper-sync. Options:
# https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md
timeout: 3
default_entry: 2
remember_last_entry: no
hash_mismatch_panic: no
interface_branding: Golden
interface_branding_color: ffffff
term_background: 000000
backdrop: 000000
term_foreground: ffffff
term_foreground_bright: ffffff
