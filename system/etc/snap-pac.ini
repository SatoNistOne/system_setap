# snap-pac (decisions §4). Format: snap-pac(8) — one section per snapper
# config; only [root] is snapshotted by default, so /home is not touched by
# pacman snapshots. "Important" snapshots have their own limit and are not
# pushed out by ordinary installs.
[root]
important_packages = ["linux-cachyos", "linux-lts", "linux-cachyos-nvidia-open", "nvidia-open-lts", "nvidia-open-dkms", "nvidia-utils", "mesa", "systemd", "glibc", "limine", "mkinitcpio"]
