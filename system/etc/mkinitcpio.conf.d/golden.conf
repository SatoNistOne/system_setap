# golden: systemd-based initramfs (decisions §2).
# sd-encrypt instead of busybox "encrypt": needed later for TPM unlock (v3)
# and reads rd.luks.name= from the kernel command line. plymouth draws the
# LUKS password prompt. Without LUKS sd-encrypt simply does nothing.
HOOKS=(base systemd plymouth autodetect microcode modconf kms keyboard sd-vconsole block sd-encrypt filesystems fsck)
